<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1769e0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="减震调校 Pro">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon.svg">
<title>电摩减震器调校 Pro</title>
<style>
:root{--bg:#f3f5f8;--card:#fff;--ink:#17202a;--muted:#687383;--line:#dce2e9;--accent:#1769e0;--soft:#edf4ff}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","PingFang SC","Microsoft YaHei",sans-serif;padding-bottom:max(28px,env(safe-area-inset-bottom))}
.app{max-width:1100px;margin:auto;padding:18px max(16px,env(safe-area-inset-right)) 40px max(16px,env(safe-area-inset-left))}
h1{font-size:clamp(26px,4vw,40px);margin:0;font-weight:900}.sub{color:var(--muted);margin:7px 0 14px}
.tabs{display:flex;gap:8px;overflow:auto;position:sticky;top:0;z-index:10;background:rgba(243,245,248,.95);backdrop-filter:blur(14px);padding:10px 0}
.tab{flex:1;min-width:128px;min-height:52px;border:1px solid var(--line);border-radius:15px;background:#fff;font-size:16px;font-weight:800;color:var(--muted);touch-action:manipulation}
.tab.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.panel{display:none}.panel.active{display:block}.card{background:#fff;border:1px solid var(--line);border-radius:22px;padding:18px;margin:14px 0}
h2{font-size:22px;margin:0 0 15px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}.field{display:flex;flex-direction:column;gap:6px}
label,.note{font-size:14px;color:var(--muted);line-height:1.6}label{font-weight:700}
input,select{min-height:52px;width:100%;border:1px solid var(--line);border-radius:14px;padding:10px 12px;background:#fff;color:var(--ink);font-size:17px}
input[type=range]{padding:0;border:0;accent-color:var(--accent)}
.primary,.secondary{min-height:58px;border-radius:17px;padding:0 18px;font-size:17px;font-weight:850;touch-action:manipulation}.primary{border:0;background:var(--accent);color:#fff}.secondary{border:1px solid var(--line);background:#fff}
.slider{padding:16px;background:#f7f9fc;border-radius:18px;margin:10px 0}.row{display:flex;justify-content:space-between}.big{font-size:24px;font-weight:900;color:var(--accent)}
.step{display:flex;gap:10px;align-items:center}.step button{width:60px;height:56px;border:1px solid var(--line);border-radius:14px;background:#fff;font-size:26px;font-weight:800}.step span{flex:1;text-align:center;color:var(--muted)}
.results{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px}.result{background:#f7f9fc;border-radius:17px;padding:15px}.label{font-size:13px;color:var(--muted)}.num{font-size:25px;font-weight:900;margin-top:5px}
.advice{display:grid;gap:9px;margin-top:12px}.advice div{background:var(--soft);border-left:5px solid var(--accent);padding:12px 14px;border-radius:10px;line-height:1.55}
.actions{display:flex;gap:10px;flex-wrap:wrap}.actions>*{flex:1;min-width:180px}.profile{background:#f7f9fc;border-radius:16px;padding:14px;margin-top:10px}
.fileLabel{display:block;text-align:center;padding:16px;border:2px dashed var(--line);border-radius:16px;font-weight:800;color:var(--muted)}.fileLabel input{display:none}
.status{margin-top:10px;font-size:14px;color:#16834d;font-weight:700}
.install{margin:12px 0;padding:12px 14px;background:#fff8e7;border-radius:14px;font-size:14px;line-height:1.5}
@media(max-width:720px){.grid,.results{grid-template-columns:1fr}.app{padding:12px 12px 32px}.card{padding:15px}.actions>*{min-width:100%}}
</style>
</head>
<body>
<div class="app">
<h1>🏍️ 电摩减震器调校 Pro</h1>
<p class="sub">iPad PWA · 离线可用 · 前后独立调校</p>
<div id="installTip" class="install">安装方法：用 Safari 打开本应用网址 → 点“分享” → “添加到主屏幕”。首次联网打开后可离线使用。</div>
<nav class="tabs">
<button class="tab active" data-tab="vehicle">① 车辆</button><button class="tab" data-tab="front">② 前减震</button><button class="tab" data-tab="rear">③ 后减震</button><button class="tab" data-tab="results">④ 结果</button><button class="tab" data-tab="data">⑤ 数据</button>
</nav>
<section class="panel active" id="vehicle"><div class="card"><h2>整车与骑行负载</h2><div class="grid">
<div class="field"><label>车型 / 调校名称</label><input id="setupName" value="我的电摩"></div><div class="field"><label>骑行用途</label><select id="style"><option value="city">城市通勤</option><option value="sport">运动 / 山路</option><option value="highway">高速巡航</option><option value="load">双人 / 重载</option></select></div>
<div class="field"><label>整车重量（kg）</label><input id="bikeWeight" type="number" value="120"></div><div class="field"><label>骑手重量（kg）</label><input id="riderWeight" type="number" value="75"></div><div class="field"><label>额外载重（kg）</label><input id="cargoWeight" type="number" value="0"></div>
</div></div><button class="primary" id="nextFront">下一步：前减震</button></section>
<section class="panel" id="front"><div class="card"><h2>前减震独立参数</h2><div class="grid">
<div class="field"><label>前轴载荷比例（%）</label><input id="frontAxle" type="number" value="45"></div><div class="field"><label>有效行程（mm）</label><input id="frontTravel" type="number" value="120"></div><div class="field"><label>弹簧等效刚度（N/mm）</label><input id="frontRate" type="number" step="0.1" value="9"></div><div class="field"><label>弹簧自由长度（mm）</label><input id="frontFree" type="number" value="300"></div><div class="field"><label>当前安装长度（mm）</label><input id="frontInstalled" type="number" value="290"></div><div class="field"><label>实际 Static Sag（mm，可选）</label><input id="frontStatic" type="number"></div><div class="field"><label>实际 Rider Sag（mm，可选）</label><input id="frontRider" type="number"></div>
</div></div><div class="card"><h2>前减震阻尼</h2>
<div class="slider"><div class="row"><b>前压缩 Compression</b><span class="big" id="frontCompV"></span></div><input id="frontComp" type="range" min="0" max="24" value="12"><div class="step"><button class="stepBtn" data-step="frontComp:-1">−</button><span>从全软开始</span><button class="stepBtn" data-step="frontComp:1">＋</button></div></div>
<div class="slider"><div class="row"><b>前回弹 Rebound</b><span class="big" id="frontRebV"></span></div><input id="frontReb" type="range" min="0" max="24" value="12"><div class="step"><button class="stepBtn" data-step="frontReb:-1">−</button><span>从全软开始</span><button class="stepBtn" data-step="frontReb:1">＋</button></div></div>
</div><button class="primary" id="nextRear">下一步：后减震</button></section>
<section class="panel" id="rear"><div class="card"><h2>后减震独立参数</h2><div class="grid">
<div class="field"><label>后轴载荷比例（%）</label><input id="rearAxle" type="number" value="55"></div><div class="field"><label>减震器有效行程（mm）</label><input id="rearTravel" type="number" value="60"></div><div class="field"><label>后弹簧刚度（N/mm）</label><input id="rearRate" type="number" step="0.1" value="80"></div><div class="field"><label>弹簧自由长度（mm）</label><input id="rearFree" type="number" value="200"></div><div class="field"><label>当前安装长度（mm）</label><input id="rearInstalled" type="number" value="190"></div><div class="field"><label>后悬挂连杆比</label><input id="rearLink" type="number" step="0.1" value="2.5"></div><div class="field"><label>实际 Static Sag（轮端 mm，可选）</label><input id="rearStatic" type="number"></div><div class="field"><label>实际 Rider Sag（轮端 mm，可选）</label><input id="rearRider" type="number"></div>
</div></div><div class="card"><h2>后减震阻尼</h2>
<div class="slider"><div class="row"><b>后压缩 Compression</b><span class="big" id="rearCompV"></span></div><input id="rearComp" type="range" min="0" max="24" value="12"><div class="step"><button class="stepBtn" data-step="rearComp:-1">−</button><span>从全软开始</span><button class="stepBtn" data-step="rearComp:1">＋</button></div></div>
<div class="slider"><div class="row"><b>后回弹 Rebound</b><span class="big" id="rearRebV"></span></div><input id="rearReb" type="range" min="0" max="24" value="12"><div class="step"><button class="stepBtn" data-step="rearReb:-1">−</button><span>从全软开始</span><button class="stepBtn" data-step="rearReb:1">＋</button></div></div>
</div><button class="primary" id="calcResults">计算前后减震</button></section>
<section class="panel" id="results"><div class="card"><h2>前减震计算结果</h2><div class="results" id="frontResults"></div><div class="advice" id="fAdvice"></div></div><div class="card"><h2>后减震计算结果</h2><div class="results" id="rearResults"></div><div class="advice" id="rAdvice"></div></div><div class="card"><h2>前后平衡提示</h2><div class="advice" id="balance"></div></div><div class="actions"><button class="primary" id="saveProfileBtn">💾 保存当前方案</button><button class="secondary" id="openData">📦 导入 / 导出</button></div></section>
<section class="panel" id="data"><div class="card"><h2>调校数据导出</h2><div class="actions"><button class="primary" id="exportCurrentBtn">⬇️ 导出当前 JSON</button><button class="secondary" id="exportProfilesBtn">⬇️ 导出全部方案</button></div></div><div class="card"><h2>调校数据导入</h2><label class="fileLabel">📂 选择 JSON 文件<input id="importFile" type="file" accept=".json,application/json"></label><div id="importStatus" class="status"></div></div><div class="card"><h2>本机方案</h2><div id="profiles"></div></div></section>
</div>
<script>
const $=id=>document.getElementById(id);
const ids=['setupName','style','bikeWeight','riderWeight','cargoWeight','frontAxle','frontTravel','frontRate','frontFree','frontInstalled','frontStatic','frontRider','frontComp','frontReb','rearAxle','rearTravel','rearRate','rearFree','rearInstalled','rearLink','rearStatic','rearRider','rearComp','rearReb'];
const num=id=>{const v=parseFloat($(id).value);return Number.isFinite(v)?v:0};
function update(){['frontComp','frontReb','rearComp','rearReb'].forEach(id=>$(id+'V').textContent=$(id).value+' Click')}
function showTab(id){document.querySelectorAll('.panel').forEach(x=>x.classList.remove('active'));document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));$(id).classList.add('active');document.querySelector(`[data-tab="${id}"]`).classList.add('active');window.scrollTo(0,0);if(id==='data')renderProfiles()}
document.querySelectorAll('.tab').forEach(b=>b.addEventListener('click',()=>showTab(b.dataset.tab)));
function step(s){let [id,d]=s.split(':');let e=$(id);e.value=Math.max(+e.min,Math.min(+e.max,+e.value+ +d));update();saveDraft()}
document.querySelectorAll('.stepBtn').forEach(b=>b.addEventListener('click',()=>step(b.dataset.step)));
function calc(axle,rate,free,installed,travel,stat,rider,link){let ratio=link?Math.max(num(link),1):1,r=Math.max(num(rate),.001),a=num(axle)/100,g=9.81,b=num('bikeWeight'),loaded=b+num('riderWeight')+num('cargoWeight'),pre=Math.max(num(free)-num(installed),0),ts=b*a*g/r*ratio,tr=loaded*a*g/r*ratio,ss=num(stat)>0?num(stat):ts,rs=num(rider)>0?num(rider):tr,e=num(travel)*ratio,target=e*({city:.30,sport:.25,highway:.28,load:.33}[$('style').value]||.30);return{pre,force:pre*r,staticSag:ss,riderSag:rs,effective:e,target,remain:Math.max(e-rs,0)}}
function cards(a){return a.map(x=>`<div class="result"><div class="label">${x[0]}</div><div class="num">${x[1]}</div></div>`).join('')}
function calculate(){let f=calc('frontAxle','frontRate','frontFree','frontInstalled','frontTravel','frontStatic','frontRider'),r=calc('rearAxle','rearRate','rearFree','rearInstalled','rearTravel','rearStatic','rearRider','rearLink');$('frontResults').innerHTML=cards([['前预载',f.pre.toFixed(1)+' mm'],['前预载力',f.force.toFixed(0)+' N'],['Static Sag',f.staticSag.toFixed(1)+' mm'],['Rider Sag',f.riderSag.toFixed(1)+' mm'],['目标 Sag',f.target.toFixed(1)+' mm'],['剩余行程',f.remain.toFixed(1)+' mm']]);$('rearResults').innerHTML=cards([['后预载',r.pre.toFixed(1)+' mm'],['后预载力',r.force.toFixed(0)+' N'],['Static Sag',r.staticSag.toFixed(1)+' mm'],['Rider Sag',r.riderSag.toFixed(1)+' mm'],['目标 Sag',r.target.toFixed(1)+' mm'],['剩余行程',r.remain.toFixed(1)+' mm']]);let adv=(x,n)=>{let d=x.riderSag-x.target;return `<div>${Math.abs(d)<=x.effective*.03?'✓ ':d>0?'⚠ '+n+' Rider Sag 偏大：增加预载；若已较高考虑更高刚度弹簧。':'⚠ '+n+' Rider Sag 偏小：减少预载；若已很低考虑较软弹簧。'}</div><div>阻尼每次建议只调整 1～2 Click，并在相同路段复测。</div>`};$('fAdvice').innerHTML=adv(f,'前减震');$('rAdvice').innerHTML=adv(r,'后减震');let fp=f.riderSag/Math.max(f.effective,1),rp=r.riderSag/Math.max(r.effective,1);$('balance').innerHTML='<div>'+ (Math.abs(fp-rp)<.05?'✓ 前后 Sag 比例接近，基础姿态较平衡。':fp>rp?'⚠ 前部相对下沉更多：检查前预载和压缩阻尼。':'⚠ 后部相对下沉更多：检查后预载和弹簧刚度。')+'</div>'}
function current(){let values={};ids.forEach(id=>values[id]=$(id).value);return{app:'EMotoSuspensionProPWA',version:1,exportedAt:new Date().toISOString(),values}}
function apply(o){let v=o.values||o;ids.forEach(id=>{if(v[id]!==undefined)$(id).value=v[id]});update();calculate();saveDraft()}
function saveDraft(){try{localStorage.setItem('emotoPwaDraft',JSON.stringify(current()))}catch(e){}}
function profiles(){try{return JSON.parse(localStorage.getItem('emotoPwaProfiles')||'[]')}catch(e){return[]}}
function renderProfiles(){let a=profiles();$('profiles').innerHTML=a.length?a.map((p,i)=>`<div class="profile"><b>${p.name}</b><div class="note">前 C/R ${p.values.frontComp}/${p.values.frontReb} · 后 C/R ${p.values.rearComp}/${p.values.rearReb}</div><div class="actions"><button class="secondary loadBtn" data-i="${i}">载入</button></div></div>`).join(''):'<div class="note">暂无保存方案。</div>';document.querySelectorAll('.loadBtn').forEach(b=>b.addEventListener('click',()=>{apply(profiles()[+b.dataset.i]);showTab('vehicle')}))}
function saveProfile(){let a=profiles();a.unshift({...current(),name:$('setupName').value||'未命名方案'});localStorage.setItem('emotoPwaProfiles',JSON.stringify(a.slice(0,50)));renderProfiles();alert('已保存到本机')}
function download(obj,name){let blob=new Blob([JSON.stringify(obj,null,2)],{type:'application/json'}),file=new File([blob],name,{type:'application/json'});if(navigator.share&&navigator.canShare&&navigator.canShare({files:[file]})){navigator.share({files:[file],title:name}).catch(()=>{});return}let u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}
$('nextFront').addEventListener('click',()=>showTab('front'));$('nextRear').addEventListener('click',()=>showTab('rear'));$('calcResults').addEventListener('click',()=>{calculate();showTab('results')});$('openData').addEventListener('click',()=>showTab('data'));$('saveProfileBtn').addEventListener('click',saveProfile);$('exportCurrentBtn').addEventListener('click',()=>download(current(),($('setupName').value||'emoto')+'_suspension.json'));$('exportProfilesBtn').addEventListener('click',()=>download({app:'EMotoSuspensionProPWAProfiles',profiles:profiles()},'emoto_profiles.json'));
$('importFile').addEventListener('change',async e=>{let f=e.target.files[0];if(!f)return;try{let o=JSON.parse(await f.text());if(Array.isArray(o.profiles)){localStorage.setItem('emotoPwaProfiles',JSON.stringify([...o.profiles,...profiles()].slice(0,50)));renderProfiles();$('importStatus').textContent='✓ 已导入方案'}else{apply(o);$('importStatus').textContent='✓ 已导入当前调校';showTab('results')}}catch(x){$('importStatus').textContent='⚠ JSON 文件无效'}});
document.querySelectorAll('input,select').forEach(e=>e.addEventListener('input',()=>{update();saveDraft()}));
try{let d=JSON.parse(localStorage.getItem('emotoPwaDraft')||'null');if(d)apply(d)}catch(e){}
if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});
update();calculate();renderProfiles();
</script>
</body></html>
